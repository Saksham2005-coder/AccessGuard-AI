name: AccessGuard AI — Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-checks:
    name: Backend Lint, Security & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv package manager
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.5"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned axe-core in tools
        run: |
          cd ../tools/axe
          npm ci

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Install Playwright Chromium with OS dependencies
        run: uv run playwright install --with-deps chromium

      - name: Ruff code formatting and lint check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Execute pytest test suite
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          JWT_SECRET_KEY: ci-environment-test-jwt-secret-key-minimum-32-chars
          APP_ENV: testing
          LOG_LEVEL: WARNING
          LLM_PROVIDER: mock
          AXE_BUNDLE_PATH: ${{ github.workspace }}/tools/axe/node_modules/axe-core/axe.min.js
        run: uv run pytest tests/ -v

  frontend-checks:
    name: Frontend Lint, Vitest & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest test suites
        run: npm run test -- --run

      - name: Compile TypeScript and build production bundle
        run: npm run build

  container-checks:
    name: Docker Container & Compose Validation
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install pinned axe-core for backend image build context
        run: |
          cd tools/axe
          npm ci

      - name: Validate docker compose configuration
        run: docker compose config

      - name: Build backend and worker Docker images
        run: docker compose build api worker

      - name: Build frontend static Nginx Docker image
        run: docker compose build frontend
