services:
  postgres:
    image: postgres:16-alpine
    container_name: accessguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-accessguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-accessguard}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-accessguard} -d ${POSTGRES_DB:-accessguard}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - accessguard-network

  redis:
    image: redis:7-alpine
    container_name: accessguard-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - accessguard-network

  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: accessguard-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - accessguard-network

volumes:
  postgres_data:
  redis_data:
  qdrant_data:

networks:
  accessguard-network:
    driver: bridge
