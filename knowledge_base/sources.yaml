    standard_version: "WCAG 2.2"
    parser_type: "w3c_wai_understanding"
    description: "Non-normative guide explaining intent, key terms, benefits, and examples for each criterion."
    is_active: true

  - source_key: wcag22_techniques
    title: "Techniques for WCAG 2.2"
    source_url: "https://www.w3.org/WAI/WCAG22/Techniques/"
    publisher: "W3C"
    standard_version: "WCAG 2.2"
    parser_type: "w3c_wai_techniques"
    description: "Sufficient and advisory techniques, common failures, and implementation guidance."
    is_active: true

  - source_key: wai_aria_apg
    title: "WAI-ARIA Authoring Practices Guide (APG)"
    source_url: "https://www.w3.org/WAI/ARIA/apg/"
    publisher: "W3C"
