# Official W3C WCAG and WAI Knowledge Sources
# Source registry for AccessGuard AI authoritative accessibility knowledge base

sources:
  - source_key: wcag22_recommendation
    title: "Web Content Accessibility Guidelines (WCAG) 2.2"
    source_url: "https://www.w3.org/TR/WCAG22/"
    publisher: "W3C"
    standard_version: "WCAG 2.2"
    parser_type: "w3c_tr_single"
    description: "Normative W3C Recommendation defining accessibility principles, guidelines, and success criteria."
